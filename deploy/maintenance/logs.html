<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dacho deployment logs</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101820;color:#d7e1ee;font:14px Arial,sans-serif}main{max-width:1200px;margin:0 auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 10px}p{color:#9baec5;line-height:1.6}a{color:#9fc5ff}label{color:#b5c4d6}pre{min-height:50vh;padding:24px;border:1px solid #293848;border-radius:12px;background:#0b1118;font:13px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#state{font-size:13px;color:#98b4d6}
</style>
<main>
  <header><div><h1>Deployment logs</h1><p>Live image pulls, container updates, health checks, and rollback output.</p></div><label><input id="live" type="checkbox" checked> Auto-refresh</label></header>
  <p><a href="/">Back to the website</a> · <a href="https://github.com/dacho-morgh/dacho/actions/workflows/publish.yml" target="_blank" rel="noopener noreferrer">Image build runs</a> · <span id="state" role="status">Connecting…</span></p>
  <pre id="logs" aria-label="Deployment output">Loading logs…</pre>
</main>
<script>
  const logs = document.getElementById('logs');
  const state = document.getElementById('state');
  let busy = false;
  async function refresh() {
    if (busy || !document.getElementById('live').checked) return;
    busy = true;
    try {
      const response = await fetch('/update/logs/data', {cache: 'no-store', credentials: 'same-origin'});
      if (!response.ok) throw new Error(response.status === 401 ? 'Login required. Reload this page to sign in.' : 'Unable to load logs. Retrying…');
      const text = await response.text();
      if (logs.textContent !== text) logs.textContent = text;
      state.textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (error) { state.textContent = error.message; }
    finally { busy = false; }
  }
  refresh();
  setInterval(refresh, 3000);
</script>
</html>
