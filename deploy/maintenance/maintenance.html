<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>به‌زودی برمی‌گردیم | Dacho</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#173052;font-family:Tahoma,Arial,sans-serif}
  main{width:min(100%,620px);padding:56px 32px;text-align:center;border:1px solid #e0e8f2;border-radius:24px;background:white;box-shadow:0 20px 60px #1730520c}
  .brand{font-size:14px;letter-spacing:3px;color:#66809e;margin-bottom:32px}.spinner{width:48px;height:48px;border:4px solid #e6eef8;border-top-color:#2463b3;border-radius:50%;margin:0 auto 28px;animation:spin 1.2s linear infinite}
  h1{font-size:clamp(23px,5vw,32px);line-height:1.7;margin:0 0 12px}p{color:#64768c;line-height:2;margin:10px 0}.english{font-family:Arial,sans-serif;font-size:15px;margin-top:24px}.status{font-size:13px;color:#7d8c9d;margin-top:28px}a{display:inline-block;margin-top:20px;font-size:12px;color:#66809e;text-decoration:none}a:hover{text-decoration:underline}
  @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
<main>
  <div class="brand" dir="ltr">DACHO</div>
  <div class="spinner" aria-hidden="true"></div>
  <h1>در حال به‌روزرسانی سرور هستیم</h1>
  <p>به‌زودی برمی‌گردیم.<br>از صبوری شما سپاسگزاریم.</p>
  <p class="english" dir="ltr">We’re updating the server.<br>We’ll be back soon.</p>
  <p class="status" role="status">پس از پایان به‌روزرسانی، صفحه به‌صورت خودکار باز می‌شود.</p>
  <a href="/update/logs">گزارش به‌روزرسانی · Deployment logs</a>
</main>
<script>
  async function check() {
    try {
      const response = await fetch('/update/status', {cache: 'no-store'});
      const status = await response.json();
      if (status.ready && !/^\/update\/?$/.test(location.pathname)) location.reload();
    } catch (_) {}
  }
  setInterval(check, 8000);
</script>
</html>
