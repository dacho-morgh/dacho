services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dacho
      POSTGRES_PASSWORD: dacho
      POSTGRES_DB: dacho-cms
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'dacho']
      interval: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://dacho:dacho@postgres:5432/dacho-cms
      PAYLOAD_SECRET_FILE: /run/secrets/payload_secret
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      BACKEND_JWKS_URL: http://backend:4000/.well-known/jwks.json
      BACKEND_URL: http://backend:4000
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-dev-internal-proxy-secret}
    secrets:
      - payload_secret
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '4000:4000'
    secrets:
      - jwt_private_key
    environment:
      PORT: '4000'
      DATABASE_URL: postgres://dacho:dacho@postgres:5432/dacho-cms
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      PAYLOAD_URL: http://frontend:3000
      PAYLOAD_API_KEY: ${PAYLOAD_API_KEY:-dev-backend-service-account}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-dev-internal-proxy-secret}
      OTP_DELIVERY: ${OTP_DELIVERY:-console}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-testtemplate}
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_started

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON_URL: http://frontend:3000/api/openapi.json
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  pgdata:

secrets:
  jwt_private_key:
    file: ./secrets/jwt-private.pem
  payload_secret:
    file: ./secrets/payload-secret
