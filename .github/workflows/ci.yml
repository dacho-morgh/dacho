name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        env:
          CI: 'true'

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (no database)
        run: pnpm test

  build-without-database:
    name: Build (without database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No Postgres service on purpose — this is the regression guard that the
      # build never requires a live database. PAYLOAD_SECRET/DATABASE_URL are
      # placeholders: the config requires them at import time, but buildSafe()
      # defers DB-touching routes to runtime.
      - name: Build
        run: pnpm --filter @dacho/frontend build
        env:
          PAYLOAD_SECRET: ci-placeholder
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dacho
          POSTGRES_PASSWORD: dacho
          POSTGRES_DB: dacho-cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dacho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fresh DB in CI has no dev-pushed schema, so migrate applies cleanly
      # without the interactive "data loss" prompt; pipe "n" defensively.
      - name: Migrate
        run: echo "n" | pnpm --filter @dacho/frontend payload migrate
        env:
          DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms
          PAYLOAD_SECRET: ci-placeholder

      - name: Backend integration tests
        run: pnpm --filter @dacho/backend test:int
        env:
          DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms

      - name: Frontend integration tests
        run: pnpm --filter @dacho/frontend test:int
        env:
          DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms
          PAYLOAD_SECRET: ci-placeholder

  e2e:
    name: E2E (prod build + seeded DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dacho
          POSTGRES_PASSWORD: dacho
          POSTGRES_DB: dacho-cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dacho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @dacho/frontend build
        env:
          DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms
          PAYLOAD_SECRET: ci-placeholder

      - name: Migrate + seed landing
        run: |
          echo "n" | pnpm --filter @dacho/frontend payload migrate
          pnpm --filter @dacho/frontend seed:landing
        env:
          DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms
          PAYLOAD_SECRET: ci-placeholder

      - name: Install Playwright Chromium
        run: pnpm --filter @dacho/frontend exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter @dacho/frontend test:e2e
        env:
          CI: 'true'
          DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms
          PAYLOAD_SECRET: ci-placeholder
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm --filter @dacho/frontend start

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14
