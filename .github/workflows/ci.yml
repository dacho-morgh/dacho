name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  branch-policy:
    name: PR base must be staging
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests outside staging
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_BASE_REF" != "staging" ]]; then
            echo "::error::Pull requests must target staging. A production release to main requires an explicit user instruction."
            exit 1
          fi

  quality:
    name: Lint + typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: CI isolation contract
        run: python3 scripts/test-ci-isolation.py

      - name: Lint
        run: pnpm lint
        env:
          CI: 'true'

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (no database)
        run: pnpm test

      - name: Deployment startup and maintenance
        run: |
          python3 scripts/test-bundled-media.py
          python3 deploy/maintenance/test_deployment.py
          python3 scripts/test-staging-deployment.py

  build-without-database:
    name: Build (without database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No Postgres service on purpose — this is the regression guard that the
      # build never requires a live database. PAYLOAD_SECRET/DATABASE_URL are
      # placeholders: the config requires them at import time, but buildSafe()
      # defers DB-touching routes to runtime.
      - name: Build
        run: pnpm --filter @dacho/frontend build
        env:
          PAYLOAD_SECRET: ci-placeholder
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHASE0_ISOLATED_TEST: '1'
      DATABASE_URL: postgres://phase0_test:phase0_test_only@127.0.0.1:55439/dacho_phase0_test
      PAYLOAD_MEDIA_DIR: ${{ github.workspace }}/.phase0-test-files
      PAYLOAD_SECRET: phase0-test-only-payload-secret-do-not-reuse
      PAYLOAD_SECRET_FILE: ''
      # dotenv 16 treats a nonempty 'false' string as true.
      DOTENV_CONFIG_OVERRIDE: ''
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: phase0_test
          POSTGRES_PASSWORD: phase0_test_only
          POSTGRES_DB: dacho_phase0_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U phase0_test -d dacho_phase0_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Initialize isolated test environment
        run: |
          mkdir -p "$PAYLOAD_MEDIA_DIR"
          printf '%s' 'dacho-phase0-disposable-v1' > "$PAYLOAD_MEDIA_DIR/phase0-test-marker.txt"
          docker exec -i "${{ job.services.postgres.id }}" psql -U phase0_test -d dacho_phase0_test -v ON_ERROR_STOP=1 < scripts/phase0-test-db-init.sql

      # Fresh DB in CI has no dev-pushed schema, so migrate applies cleanly
      # without the interactive "data loss" prompt; pipe "n" defensively.
      - name: Migrate
        run: echo "n" | pnpm --filter @dacho/frontend payload migrate

      - name: Backend integration tests
        run: pnpm --filter @dacho/backend test:int

      - name: Frontend integration tests
        run: pnpm --filter @dacho/frontend test:int

  e2e:
    name: E2E (prod build + seeded DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://dacho:dacho@127.0.0.1:5432/dacho-cms
      PAYLOAD_SECRET: ci-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000
      # Do not let a checked-out dotenv file override the ephemeral CI settings.
      DOTENV_CONFIG_OVERRIDE: ''
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dacho
          POSTGRES_PASSWORD: dacho
          POSTGRES_DB: dacho-cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dacho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate ephemeral backend credentials
        run: |
          node --input-type=module <<'NODE'
          import { generateKeyPairSync, randomBytes } from 'node:crypto'
          import { appendFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const keyPath = join(process.env.RUNNER_TEMP, 'e2e-jwt-private.pem')
          const { privateKey } = generateKeyPairSync('ec', { namedCurve: 'prime256v1' })
          writeFileSync(keyPath, privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 })
          const serviceKey = randomBytes(32).toString('hex')
          const proxySecret = randomBytes(32).toString('hex')
          console.log(`::add-mask::${serviceKey}`)
          console.log(`::add-mask::${proxySecret}`)
          appendFileSync(process.env.GITHUB_ENV, [
            `JWT_PRIVATE_KEY_FILE=${keyPath}`,
            `PAYLOAD_API_KEY=${serviceKey}`,
            `SERVICE_ACCOUNT_API_KEY=${serviceKey}`,
            'SERVICE_ACCOUNT_PHONE=09120000002',
            `INTERNAL_PROXY_SECRET=${proxySecret}`,
            '',
          ].join('\n'))
          NODE

      # Migrate + seed BEFORE building. The Postgres service is reachable here,
      # so buildSafe() does NOT skip the prerender queries — it only tolerates
      # connection-init failures. An unmigrated database therefore fails the
      # build with `relation "pages" does not exist`, which is correct
      # behaviour: a reachable database with a broken schema is a real error.
      # The DB-free path is covered by the build-without-database job above.
      - name: Migrate + seed content
        run: |
          echo "n" | pnpm --filter @dacho/frontend payload migrate
          pnpm --filter @dacho/frontend seed:landing
          pnpm --filter @dacho/frontend seed:mag
          pnpm --filter @dacho/frontend seed:service-account

      - name: Build
        run: |
          pnpm --filter @dacho/backend build
          pnpm --filter @dacho/frontend build

      - name: Use Ubuntu archive mirror for browser dependencies
        run: |
          # Newer runners use mirror+file URIs in ubuntu.sources.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done

      - name: Install Playwright Chromium
        run: pnpm --filter @dacho/frontend exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter @dacho/frontend test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm --filter @dacho/frontend start
          PLAYWRIGHT_BACKEND_SERVER_COMMAND: pnpm --filter @dacho/backend start

      - name: Remove ephemeral backend key
        if: always()
        run: rm -f "$RUNNER_TEMP/e2e-jwt-private.pem"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14

  publish-images:
    name: Publish images after checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: [branch-policy, quality, build-without-database, integration, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
