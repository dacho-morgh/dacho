name: Publish

# Called by CI only after the same checks pass for main and staging. The VPS
# production poller looks for sha-<commit> and must never see a staging build.
env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: '7'

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.service }}
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=sha-,enable=${{ github.ref_name == 'main' }}
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=sha,format=short,prefix=staging-sha-,enable=${{ github.ref_name == 'staging' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'staging' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ github.ref_name }}
